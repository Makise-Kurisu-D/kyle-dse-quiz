<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kyle 錯題本 · DSE 複習</title>
<meta name="description" content="Kyle 的 DSE 化學／生物錯題本：按課題練習、自動批改、踩分點自檢、刷題記錄">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 桌面側邊欄 -->
<nav class="rail" id="rail">
  <div class="rail-logo">
    <span class="rail-logo-mark">K</span>
    <span class="rail-logo-text">錯題本</span>
  </div>
  <a class="rail-item" href="#/" data-route="home">
    <span class="rail-ico">🏠</span><span>主頁</span>
  </a>
  <a class="rail-item" href="#/practice" data-route="practice">
    <span class="rail-ico">✏️</span><span>練習</span>
  </a>
  <a class="rail-item" href="#/records" data-route="records">
    <span class="rail-ico">📈</span><span>記錄</span>
  </a>
  <div class="rail-spacer"></div>
  <button class="rail-item rail-reset" id="railReset" type="button">
    <span class="rail-ico">🧹</span><span>重設</span>
  </button>
</nav>

<main class="app" id="app"><!-- 視圖由 app.js 渲染 --></main>

<!-- 手機底部標籤欄 -->
<nav class="tabbar" id="tabbar">
  <a class="tab-item" href="#/" data-route="home">
    <span class="tab-ico">🏠</span><span class="tab-label">主頁</span>
  </a>
  <a class="tab-item" href="#/practice" data-route="practice">
    <span class="tab-ico">✏️</span><span class="tab-label">練習</span>
  </a>
  <a class="tab-item" href="#/records" data-route="records">
    <span class="tab-ico">📈</span><span class="tab-label">記錄</span>
  </a>
</nav>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
