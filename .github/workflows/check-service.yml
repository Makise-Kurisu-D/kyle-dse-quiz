name: Check live sync service

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-service.yml'
      - 'paper-reader.js'
      - 'paper-reader.test.mjs'
      - 'study-experience.js'
      - 'study-experience.css'
      - 'study-experience.test.mjs'
      - 'home-pages.css'
      - 'home-scenes.js'
      - 'tests/redesign_browser.py'
      - 'notebook*'
      - 'demo/**'
      - 'app.js'
      - 'subject-config.js'
      - 'app.test.mjs'
      - 'index.html'
      - 'ios-widget.html'
      - 'ios-widget.js'
      - 'ios-widget.test.mjs'
      - 'library.js'
      - 'library.css'
      - 'library.test.mjs'
      - 'style.css'
      - 'appearance.js'
      - 'appearance.css'
      - 'appearance.test.mjs'
      - 'visual/**'
      - 'images/persona3/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Cloudflare Worker']
    types: [completed]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Walk the student journeys with synthetic data
        run: |
          CHROME=$(python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          python -B tests/redesign_browser.py --chrome "$CHROME" --suite all --screenshots --artifacts /tmp/dse-redesign-browser
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-browser-evidence
          path: /tmp/dse-redesign-browser/
          if-no-files-found: ignore
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test website and Worker
        run: node --test *.test.mjs sync-worker/worker.test.mjs
      - name: Probe health and password login reachability
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expectedVersion = readFileSync('sync-worker/worker.js', 'utf8').match(/^const SERVICE_VERSION = ['"]([^'"]+)['"];?$/m)?.[1];
          if (!expectedVersion) throw new Error('Missing expected Worker version');
          const base = 'https://snowy-cake-a0a7.3355718646.workers.dev';
          const origin = 'https://makise-kurisu-d.github.io';
          const probes = [
            { name: 'health', path: '/health', expected: r => r.status === 200 && r.body.ok === true && r.body.passwordConfigured === true && r.body.version === expectedVersion && r.body.aiConfigured === true && r.body.aiProvider === 'DeepSeek' && r.body.aiModel === 'deepseek-flash' && r.body.aiFiguresEnabled === true },
            { name: 'login-preflight', path: '/auth/password', options: { method: 'OPTIONS',
              headers: { Origin: origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': 'content-type' } },
              expected: r => r.status === 204 && r.allowOrigin === origin },
            { name: 'login-route', path: '/auth/password', options: { method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' }, body: '{}' },
              expected: r => r.status === 401 && r.body.error === 'invalid_password' },
            { name: 'login-storage', path: '/auth/password', options: { method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: 'diagnostic-intentionally-invalid-password' }) },
              expected: r => (r.status === 401 && r.body.error === 'invalid_password') || (r.status === 429 && r.body.error === 'too_many_attempts') },
          ];
          await Promise.all(probes.map(async probe => {
            const started = Date.now();
            try {
              let response, body;
              const attempts = probe.name === 'health' ? 60 : 1;
              for (let attempt = 1; attempt <= attempts; attempt++) {
                const path = probe.path + (probe.name === 'health' ? '?probe=' + Date.now() : '');
                response = await fetch(base + path, { ...probe.options, cache: 'no-store', signal: AbortSignal.timeout(15000) });
                body = response.status === 204 ? {} : await response.json();
                if (probe.name !== 'health' || (response.ok && body.version === expectedVersion) || attempt === attempts) break;
                console.warn(JSON.stringify({ probe: 'health-propagation', expectedVersion, observedVersion: body.version, attempt }));
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
              const result = { probe: probe.name, status: response.status, elapsedMs: Date.now() - started,
                allowOrigin: response.headers.get('access-control-allow-origin'),
                preflightMaxAge: response.headers.get('access-control-max-age'),
                body: probe.name === 'health' ? { expectedVersion, ok: body.ok, version: body.version, passwordConfigured: body.passwordConfigured, aiConfigured: body.aiConfigured, aiProvider: body.aiProvider, aiModel: body.aiModel, aiFiguresEnabled: body.aiFiguresEnabled } : { error: body.error } };
              console.log(JSON.stringify(result));
              if (!probe.expected(result)) process.exitCode = 1;
            } catch (error) {
              console.error(JSON.stringify({ probe: probe.name, elapsedMs: Date.now() - started, error: error.name }));
              process.exitCode = 1;
            }
          }));
          NODE
      - name: Verify published homepage and versioned assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const base = 'https://makise-kurisu-d.github.io/kyle-dse-quiz/';
          const assets = new Map();
          for (const entry of ['index.html', 'demo/index.html']) {
            const html = readFileSync(entry, 'utf8');
            if (!html.includes('notebook.css?v=') || !html.includes('notebook.js?v=') || /(?:appearance|home-scenes)\.(?:css|js)\?v=/.test(html)) throw new Error('Not the current notebook shell: ' + entry);
            assets.set(entry, entry);
            const entryUrl = new URL(entry, base);
            for (const match of html.matchAll(/(?:src|href)="([^"#]+\.(?:js|css|svg)(?:\?[^"\s]*)?)"/g)) {
              const url = new URL(match[1], entryUrl);
              if (url.origin !== entryUrl.origin || !url.pathname.startsWith(new URL(base).pathname)) throw new Error('Nonlocal app asset: ' + match[1]);
              const local = decodeURIComponent(url.pathname.slice(new URL(base).pathname.length));
              assets.set(local, local + url.search);
            }
          }
          for (const file of ['notebook.css', 'notebook.js', 'notebook-mark.svg', 'app.js', 'library.js', 'paper-reader.js', 'subject-config.js', 'study-experience.js', 'demo/demo-data.js', 'demo/demo-adapter.js']) {
            if (!assets.has(file)) throw new Error('Missing current asset: ' + file);
          }
          let lastError;
          for (let attempt = 1; attempt <= 60; attempt++) {
            try {
              const response = await fetch(base + '?probe=' + Date.now(), { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              const html = await response.text();
              if (!response.ok || html !== readFileSync('index.html', 'utf8')) throw new Error('Homepage unavailable or awaiting current Pages release: HTTP ' + response.status);
              await Promise.all([...assets].map(async ([local, asset]) => {
                const url = new URL(asset, base);
                url.searchParams.set('probe', Date.now());
                const result = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
                if (!result.ok || !Buffer.from(await result.arrayBuffer()).equals(readFileSync(local))) throw new Error('Published asset differs or is unavailable: ' + asset + ' HTTP ' + result.status);
              }));
              console.log(JSON.stringify({ probe: 'published-website', status: response.status, assets: [...assets.keys()], attempt }));
              lastError = null;
              break;
            } catch (error) {
              lastError = error;
              console.warn(JSON.stringify({ probe: 'pages-propagation', attempt, error: error.message }));
              if (attempt < 60) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (lastError) throw lastError;
          NODE

